[package]
name = "sturdy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Ergonomic Rust API for SturdyEngine 5, statically bundled"
# Lets this crate publish build metadata to its dependents (see build.rs and the sturdy-build crate: the `export-symbols` feature needs a
# linker flag that only the final executable can carry).
links = "sturdy_rs"
build = "build.rs"
keywords = ["gamedev", "engine", "vulkan", "rhi"]
categories = ["game-engines", "api-bindings", "rendering::engine"]

[dependencies]
sturdy-sys = { path = "../sturdy-sys" }
# Backs `#[derive(sturdy::Bundle)]` / `#[derive(Bundle)]` (via the prelude); see src/ecs.rs's
# `Bundle` trait for what it generates.
sturdy-macros = { path = "../sturdy-macros" }
# Networking / files / processes / parallelism over the engine's C ABI (see `sturdy::net`). The C functions it declares are satisfied by the
# engine static library `sturdy-sys` links (the FFI package is part of the shim's link line).
sturdy-net = { path = "../sturdy-net" }
# Scripts over the same C ABI (see `sturdy::script`).
sturdy-script = { path = "../sturdy-script" }
# Needed to name `cxx::UniquePtr<...>` in the RHI command-encoder RAII wrappers (sturdy-sys already
# depends on this same version; see src/rhi.rs).
cxx = "1"
# Backs the typed `Component` trait in src/ecs.rs: `Pod` gives a checked, zero-copy byte view of a
# caller's `#[repr(C)]` struct instead of hand-written `unsafe` transmutes.
bytemuck = { version = "1", features = ["derive"] }
# Vector/quaternion/matrix types for positions, rotations, scales, directions, colors, etc. —
# GLSL-shaped math (operator overloading, swizzling) instead of raw `[f32; N]` arrays. `bytemuck`
# gets glam's types a `Pod`/`Zeroable` impl so they drop straight into `#[derive(Component)]`
# structs. `scalar-math` turns off glam's default SIMD-backed layout (which over-aligns `Vec4`/
# `Quat`/`Mat4` to 16 bytes) so every type's alignment matches its plain `[f32; N]` equivalent —
# required for byte-exact parity with the engine's tightly-packed (non-GLM-aligned) C++ structs;
# see `scene.rs`'s module doc comment for why that parity matters.
glam = { version = "0.33", features = ["bytemuck", "scalar-math"] }
# Backs `sturdy::markdown` (CommonMark parsing for the UI Markdown view).
pulldown-cmark = { version = "0.13", default-features = false }
# Optional (feature `raw-window-handle`): lets `NativeWindowHandle` be passed to crates that parent
# native dialogs / webviews to the engine window (`rfd::FileDialog::set_parent`, `wry`, `tao`).
raw-window-handle = { version = "0.6", optional = true }

# Passthrough: an application picks its engine build configuration here instead of ever touching
# sturdy-sys or CMake directly. See sturdy-sys/Cargo.toml for what each one maps to.
[features]
default = ["export-symbols"]
## Exports the executable's symbols to its dynamic symbol table (`-rdynamic` / `--export-dynamic`, `-export_dynamic` on macOS) so the engine's
## native stack traces (`sturdy::trace`, the crash handler, `sturdy::trace::install_panic_hook`) name functions at runtime, even in a release
## build with `strip = "symbols"`. Costs a larger dynamic symbol table and symbols the linker cannot drop as unused. The flag has to be on the
## final link line, which a library cannot arrange: add `sturdy-build` as a build-dependency and call `sturdy_build::emit()` from your
## build.rs. Turn this off (`default-features = false`) for the smallest binary; traces still resolve offline from module offsets.
export-symbols = ["sturdy-sys/export-symbols"]
webgpu = ["sturdy-sys/webgpu"]
glfw = ["sturdy-sys/glfw"]
tracy = ["sturdy-sys/tracy"]
debug-sections = ["sturdy-sys/debug-sections"]
native-cpu = ["sturdy-sys/native-cpu"]
